<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" class="diagram" viewBox="-110 -70 600 420" role="img" aria-label="Diagram of the agent-radar drawer, 300 px wide, with a 32 px status column" preserveAspectRatio="xMidYMid meet"><style>svg{--color-error: oklch(52% 0.19 27);--color-success: oklch(50% 0.12 150);--color-paper: oklch(35% 0.105 256);--color-paper-2: oklch(31% 0.10 257);--color-paper-3: oklch(26.5% 0.095 258);--color-ink: oklch(97% 0.012 240);--color-ink-2: oklch(90% 0.025 242);--color-muted: oklch(80% 0.045 244);--color-rule: oklch(93% 0.02 240 / 0.85);--color-rule-2: oklch(93% 0.02 240 / 0.32);--color-grid: oklch(97% 0.01 240 / 0.09);--color-grid-2: oklch(97% 0.01 240 / 0.2);--color-accent: oklch(97% 0.012 240);--color-accent-ink: oklch(33% 0.105 256);--color-focus: oklch(97% 0.012 240);--font-display: "Chakra Petch", ui-sans-serif, sans-serif;--font-body: "IBM Plex Sans", ui-sans-serif, sans-serif;--font-outlier: "IBM Plex Mono", ui-monospace, monospace;background:var(--color-paper)}.dw-line, .dw-faint, .dw-heavy, .dw-dash, .dw-sheet, .dw-none { fill: none; }
.dw-line { stroke: var(--color-rule); stroke-width: 1.5; }
.dw-heavy { stroke: var(--color-ink); stroke-width: 3; }
.dw-faint { stroke: var(--color-rule-2); stroke-width: 1.5; }
.dw-sheet { fill: var(--color-paper-3); stroke: var(--color-ink); stroke-width: 2; }
.dw-solid { fill: var(--color-ink); stroke: none; }
.dw-solid-soft { fill: var(--color-rule-2); stroke: none; }
.dw-none { stroke: none; }
.dw-text rect { fill: var(--color-rule-2); }
.dw-label { fill: var(--color-ink-2); font-family: var(--font-body); font-weight: 500; font-size: 15px; }
.dw-label-md { font-family: var(--font-display); font-weight: 600; font-size: 19px; fill: var(--color-ink); }
.dw-dim path { stroke: var(--color-ink); stroke-width: 1.25; fill: none; }
.dw-dim text { fill: var(--color-ink); font-family: var(--font-outlier); font-weight: 500; font-size: 17px; }
.dw-mark circle { fill: var(--color-paper); stroke: var(--color-ink); stroke-width: 1.5; }
.dw-mark text { fill: var(--color-ink); font-family: var(--font-outlier); font-weight: 500; font-size: 15px; }
.dw-mark[data-active] circle { fill: var(--color-ink); }
.dw-mark[data-active] text { fill: var(--color-accent-ink); }
.dw-leader {
.dw-leader[data-active] { stroke-dashoffset: 0; }
.dw-target { fill: var(--color-ink); opacity: 0; transition: opacity var(--dur-short) var(--ease-out); }
.dw-target[data-active] { opacity: 1; }</style><rect x="-110" y="-70" width="600" height="420" fill="oklch(35% 0.105 256)"/><path class="dw-heavy" d="M300 -40V330"></path><rect class="dw-sheet" x="0" y="0" width="300" height="250"></rect><path class="dw-faint" d="M268 0V250M0 50H268"></path><text class="dw-label dw-label-sm" x="16" y="30" text-anchor="start">All</text><text class="dw-label dw-label-sm" x="238" y="30" text-anchor="middle">✕</text><circle class="dw-line" cx="284" cy="32" r="11"></circle><g><rect class="dw-line" x="16" y="66" width="20" height="20"></rect><g class="dw-text"><rect x="48" y="68" width="140" height="5"></rect><rect x="48" y="80" width="96" height="5"></rect></g><g class="dw-text"><rect x="212" y="68" width="30" height="5"></rect></g><circle class="dw-solid" cx="284" cy="76" r="5"></circle></g><g><rect class="dw-line" x="16" y="110" width="20" height="20"></rect><g class="dw-text"><rect x="48" y="112" width="120" height="5"></rect><rect x="48" y="124" width="96" height="5"></rect></g><g class="dw-text"><rect x="212" y="112" width="30" height="5"></rect></g><circle class="dw-solid" cx="284" cy="120" r="5"></circle></g><g><rect class="dw-line" x="16" y="154" width="20" height="20"></rect><g class="dw-text"><rect x="48" y="156" width="100" height="5"></rect><rect x="48" y="168" width="96" height="5"></rect></g><g class="dw-text"><rect x="212" y="156" width="30" height="5"></rect></g><circle class="dw-faint" cx="284" cy="164" r="5"></circle></g><g><rect class="dw-line" x="16" y="198" width="20" height="20"></rect><g class="dw-text"><rect x="48" y="200" width="80" height="5"></rect><rect x="48" y="212" width="96" height="5"></rect></g><g class="dw-text"><rect x="212" y="200" width="30" height="5"></rect></g><circle class="dw-faint" cx="284" cy="208" r="5"></circle></g><g class="dw-dim"><path d="M0 -34L300 -34"></path><path d="M-7 -27L7 -41"></path><path d="M293 -27L307 -41"></path><text x="150" y="-44" text-anchor="middle" dominant-baseline="auto">300</text></g><g class="dw-dim"><path d="M268 286L300 286"></path><path d="M261 293L275 279"></path><path d="M293 293L307 279"></path><text x="284" y="308" text-anchor="middle" dominant-baseline="auto">32</text></g><g class="dw-dim"><path d="M264 322L300 322"></path><path d="M257 329L271 315"></path><path d="M293 329L307 315"></path><text x="282" y="344" text-anchor="middle" dominant-baseline="auto">36 peek</text></g><g><g><path class="dw-leader" pathLength="1" d="M420 40L284 32"></path><circle class="dw-target" cx="284" cy="32" r="4"></circle></g><g><path class="dw-leader" pathLength="1" d="M-60 150L40 132"></path><circle class="dw-target" cx="40" cy="132" r="4"></circle></g><g><path class="dw-leader" pathLength="1" d="M-60 30L24 26"></path><circle class="dw-target" cx="24" cy="26" r="4"></circle></g><g class="dw-mark"><circle cx="420" cy="40" r="15"></circle><text x="420" y="40" text-anchor="middle" dominant-baseline="central">1</text></g><g class="dw-mark"><circle cx="-60" cy="150" r="15"></circle><text x="-60" y="150" text-anchor="middle" dominant-baseline="central">2</text></g><g class="dw-mark"><circle cx="-60" cy="30" r="15"></circle><text x="-60" y="30" text-anchor="middle" dominant-baseline="central">3</text></g></g></svg>