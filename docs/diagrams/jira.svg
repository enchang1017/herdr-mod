<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" class="diagram" viewBox="-110 -80 1320 900" role="img" aria-label="Diagram of the jira sprint board, one lane per story and 86 px sub-task cards" preserveAspectRatio="xMidYMid meet"><style>svg{--color-error: oklch(52% 0.19 27);--color-success: oklch(50% 0.12 150);--color-paper: oklch(35% 0.105 256);--color-paper-2: oklch(31% 0.10 257);--color-paper-3: oklch(26.5% 0.095 258);--color-ink: oklch(97% 0.012 240);--color-ink-2: oklch(90% 0.025 242);--color-muted: oklch(80% 0.045 244);--color-rule: oklch(93% 0.02 240 / 0.85);--color-rule-2: oklch(93% 0.02 240 / 0.32);--color-grid: oklch(97% 0.01 240 / 0.09);--color-grid-2: oklch(97% 0.01 240 / 0.2);--color-accent: oklch(97% 0.012 240);--color-accent-ink: oklch(33% 0.105 256);--color-focus: oklch(97% 0.012 240);--font-display: "Chakra Petch", ui-sans-serif, sans-serif;--font-body: "IBM Plex Sans", ui-sans-serif, sans-serif;--font-outlier: "IBM Plex Mono", ui-monospace, monospace;background:var(--color-paper)}.dw-line, .dw-faint, .dw-heavy, .dw-dash, .dw-sheet, .dw-none { fill: none; }
.dw-line { stroke: var(--color-rule); stroke-width: 1.5; }
.dw-heavy { stroke: var(--color-ink); stroke-width: 3; }
.dw-faint { stroke: var(--color-rule-2); stroke-width: 1.5; }
.dw-sheet { fill: var(--color-paper-3); stroke: var(--color-ink); stroke-width: 2; }
.dw-solid { fill: var(--color-ink); stroke: none; }
.dw-solid-soft { fill: var(--color-rule-2); stroke: none; }
.dw-none { stroke: none; }
.dw-text rect { fill: var(--color-rule-2); }
.dw-label { fill: var(--color-ink-2); font-family: var(--font-body); font-weight: 500; font-size: 15px; }
.dw-label-md { font-family: var(--font-display); font-weight: 600; font-size: 19px; fill: var(--color-ink); }
.dw-dim path { stroke: var(--color-ink); stroke-width: 1.25; fill: none; }
.dw-dim text { fill: var(--color-ink); font-family: var(--font-outlier); font-weight: 500; font-size: 17px; }
.dw-mark circle { fill: var(--color-paper); stroke: var(--color-ink); stroke-width: 1.5; }
.dw-mark text { fill: var(--color-ink); font-family: var(--font-outlier); font-weight: 500; font-size: 15px; }
.dw-mark[data-active] circle { fill: var(--color-ink); }
.dw-mark[data-active] text { fill: var(--color-accent-ink); }
.dw-leader {
.dw-leader[data-active] { stroke-dashoffset: 0; }
.dw-target { fill: var(--color-ink); opacity: 0; transition: opacity var(--dur-short) var(--ease-out); }
.dw-target[data-active] { opacity: 1; }</style><rect x="-110" y="-80" width="1320" height="900" fill="oklch(35% 0.105 256)"/><rect class="dw-heavy" x="0" y="0" width="1080" height="720"></rect><path class="dw-line" d="M0 44H1080M0 86H1080M0 122H1080M0 152H1080"></path><rect class="dw-line" x="14" y="8" width="28" height="28"></rect><text class="dw-label dw-label-md" x="54" y="28" text-anchor="start">Jira</text><g><text class="dw-label dw-label-sm" x="64" y="70" text-anchor="middle">Mine</text></g><g><rect class="dw-solid-soft" x="124" y="52" width="100" height="26"></rect><text class="dw-label dw-label-sm" x="174" y="70" text-anchor="middle">Board</text></g><g><text class="dw-label dw-label-sm" x="284" y="70" text-anchor="middle">In progress</text></g><g><text class="dw-label dw-label-sm" x="394" y="70" text-anchor="middle">To do</text></g><g><text class="dw-label dw-label-sm" x="504" y="70" text-anchor="middle">Recent</text></g><g><text class="dw-label dw-label-sm" x="614" y="70" text-anchor="middle">Sprint</text></g><g><text class="dw-label dw-label-sm" x="724" y="70" text-anchor="middle">JQL</text></g><g class="dw-text"><rect x="20" y="101" width="200" height="6"></rect></g><rect class="dw-line" x="860" y="100" width="160" height="8"></rect><rect class="dw-solid" x="860" y="100" width="96" height="8"></rect><text class="dw-label dw-label-sm" x="30" y="142" text-anchor="start">To do</text><text class="dw-label dw-label-sm" x="290" y="142" text-anchor="start">In progress</text><text class="dw-label dw-label-sm" x="550" y="142" text-anchor="start">Code review</text><text class="dw-label dw-label-sm" x="810" y="142" text-anchor="start">Done</text><g><rect class="dw-faint" x="10" y="170" width="1060" height="34"></rect><g class="dw-text"><rect x="30" y="184" width="320" height="6"></rect></g><g><rect class="dw-line" x="20" y="216" width="240" height="86"></rect><g class="dw-text"><rect x="34" y="230" width="180" height="5"></rect><rect x="34" y="244" width="130" heigh