<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="1050" class="diagram" viewBox="-70 -70 1580 1050" role="img" aria-label="Diagram of the Herdr window with the spaces-agents sidebar, the agent-radar drawer and the picker-plus popup at their shipped sizes" preserveAspectRatio="xMidYMid meet"><style>svg{--color-error: oklch(52% 0.19 27);--color-success: oklch(50% 0.12 150);--color-paper: oklch(35% 0.105 256);--color-paper-2: oklch(31% 0.10 257);--color-paper-3: oklch(26.5% 0.095 258);--color-ink: oklch(97% 0.012 240);--color-ink-2: oklch(90% 0.025 242);--color-muted: oklch(80% 0.045 244);--color-rule: oklch(93% 0.02 240 / 0.85);--color-rule-2: oklch(93% 0.02 240 / 0.32);--color-grid: oklch(97% 0.01 240 / 0.09);--color-grid-2: oklch(97% 0.01 240 / 0.2);--color-accent: oklch(97% 0.012 240);--color-accent-ink: oklch(33% 0.105 256);--color-focus: oklch(97% 0.012 240);--font-display: "Chakra Petch", ui-sans-serif, sans-serif;--font-body: "IBM Plex Sans", ui-sans-serif, sans-serif;--font-outlier: "IBM Plex Mono", ui-monospace, monospace;background:var(--color-paper)}.dw-line, .dw-faint, .dw-heavy, .dw-dash, .dw-sheet, .dw-none { fill: none; }
.dw-line { stroke: var(--color-rule); stroke-width: 1.5; }
.dw-heavy { stroke: var(--color-ink); stroke-width: 3; }
.dw-faint { stroke: var(--color-rule-2); stroke-width: 1.5; }
.dw-sheet { fill: var(--color-paper-3); stroke: var(--color-ink); stroke-width: 2; }
.dw-solid { fill: var(--color-ink); stroke: none; }
.dw-solid-soft { fill: var(--color-rule-2); stroke: none; }
.dw-none { stroke: none; }
.dw-text rect { fill: var(--color-rule-2); }
.dw-label { fill: var(--color-ink-2); font-family: var(--font-body); font-weight: 500; font-size: 15px; }
.dw-label-md { font-family: var(--font-display); font-weight: 600; font-size: 19px; fill: var(--color-ink); }
.dw-dim path { stroke: var(--color-ink); stroke-width: 1.25; fill: none; }
.dw-dim text { fill: var(--color-ink); font-family: var(--font-outlier); font-weight: 500; font-size: 17px; }
.dw-mark circle { fill: var(--color-paper); stroke: var(--color-ink); stroke-width: 1.5; }
.dw-mark text { fill: var(--color-ink); font-family: var(--font-outlier); font-weight: 500; font-size: 15px; }
.dw-mark[data-active] circle { fill: var(--color-ink); }
.dw-mark[data-active] text { fill: var(--color-accent-ink); }
.dw-leader {
.dw-leader[data-active] { stroke-dashoffset: 0; }
.dw-target { fill: var(--color-ink); opacity: 0; transition: opacity var(--dur-short) var(--ease-out); }
.dw-target[data-active] { opacity: 1; }</style><rect x="-70" y="-70" width="1580" height="1050" fill="oklch(35% 0.105 256)"/><g><rect class="dw-heavy" x="0" y="0" width="1440" height="900"></rect><g><path class="dw-line" d="M268 42H1440M268 872H1440"></path><rect class="dw-line" x="280" y="9" width="120" height="24"></rect><rect class="dw-faint" x="412" y="9" width="120" height="24"></rect><rect class="dw-faint" x="544" y="9" width="120" height="24"></rect><rect class="dw-faint" x="276" y="50" width="560" height="814"></rect><rect class="dw-faint" x="844" y="50" width="588" height="814"></rect><path class="dw-faint" d="M276 80h560M844 80H1432"></path><g class="dw-text"><rect x="292" y="98" width="420" height="5"></rect><rect x="292" y="120" width="300" height="5"></rect><rect x="292" y="142" width="360" height="5"></rect><rect x="292" y="164" width="180" height="5"></rect><rect x="292" y="186" width="460" height="5"></rect><rect x="292" y="208" width="240" height="5"></rect><rect x="292" y="230" width="390" height="5"></rect><rect x="292" y="252" width="140" height="5"></rect><rect x="292" y="274" width="330" height="5"></rect><rect x="292" y="296" width="280" height="5"></rect><rect x="292" y="318" width="410" height="5"></rect><rect x="292" y="340" width="220" height="5"></rect><rect x="292" y="362" width="300" height="5"></rect><rect x="292" y="384" width="160" height="5"></rect><rect x="292" y="406" width="370" height="5"></rect><rect x="292" y="428" width="260" height="5"></rect><rect x="292" y="450" width="340" height="5"></rect><rect x="292" y="472" width="200" height="5"></rect></g><g class="dw-text"><rect x="860" y="98" width="368" height="5"></rect><rect x="860" y="120" width="192" height="5"></rect><rect x="860" y="142" width="312" height="5"></rect><rect x="860" y="164" width="112" height="5"></rect><rect x="860" y="186" width="264" height="5"></rect><rect x="860" y="208" width="224" height="5"></rect><rect x="860" y="230" width="328" height="5"></rect><